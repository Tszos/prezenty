<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listy prezentów</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#16204A">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <p class="occasion">
      <svg class="star" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
        <path d="M24 1 27.6 15.2 34.6 13.4 32.8 20.4 47 24 32.8 27.6 34.6 34.6 27.6 32.8 24 47 20.4 32.8 13.4 34.6 15.2 27.6 1 24 15.2 20.4 13.4 13.4 20.4 15.2Z"/>
      </svg>
      <span id="occasion"></span>
    </p>
    <h1>Listy prezentów</h1>
    <p class="lead">Wybierz, dla kogo szukasz prezentu. Na każdej liście możesz zarezerwować prezent, żeby nikt nie kupił tego samego. Nie potrzebujesz konta.</p>
  </div>
</header>
<main class="wrap">
  <nav aria-label="Listy prezentów">
    <ul class="people" id="people"></ul>
  </nav>
</main>
<footer class="foot">
  <p>Każda osoba ma swoją listę i swój link, który możesz wysłać dalej.</p>
</footer>
<script src="config.js"></script>
<script>
  (function () {
    "use strict";
    var cfg = window.GIFT_CONFIG || {}, people = cfg.people || {};
    document.getElementById("occasion").textContent = cfg.occasion || "";
    var list = document.getElementById("people");
    Object.keys(people).forEach(function (k) {
      var p = people[k], li = document.createElement("li"), a = document.createElement("a");
      a.className = "person"; a.href = k + "/";
      var name = document.createElement("span"); name.className = "person-name"; name.textContent = p.name || k;
      var sub = document.createElement("span"); sub.className = "person-sub"; sub.textContent = "Lista prezentów " + (p.nameGen || p.name || k);
      a.appendChild(name); a.appendChild(sub);
      a.insertAdjacentHTML("beforeend", '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>');
      li.appendChild(a); list.appendChild(li);
    });
  })();
</script>
</body>
</html>
