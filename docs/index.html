<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listy prezentów</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F3EEEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1216" media="(prefers-color-scheme: dark)">
<script src="theme.js?v=202611122210"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css?v=202611122210">
<link rel="stylesheet" href="components.css?v=202611122210">
<link rel="stylesheet" href="style.css?v=202611122210">
</head>
<body class="d-page">
<header class="d-header hero">
  <div class="hero-inner">
    <div class="d-header__bar">
      <h1>Listy prezentów</h1>
      <button type="button" class="d-theme-toggle" data-theme-toggle aria-label="Zmień motyw">
        <svg class="d-moon" aria-hidden="true"><use href="icons.svg#i-moon"/></svg>
        <svg class="d-sun" aria-hidden="true"><use href="icons.svg#i-sun"/></svg>
      </button>
    </div>
    <p class="d-subtitle occasion" id="occasion"></p>
    <p class="lead">Rzeczy, które chcielibyśmy dostać. Wybierz osobę i zarezerwuj prezent, żeby nikt nie kupił tego samego.</p>
  </div>
</header>
<main class="wrap">
  <nav aria-label="Listy prezentów">
    <ul class="people" id="people"></ul>
  </nav>
</main>
<footer class="foot">
  <p>Każda osoba ma swoją listę i swój link, który możesz wysłać dalej.</p>
</footer>
<script src="config.js?v=202611122210"></script>
<script>
  (function () {
    "use strict";
    var cfg = window.GIFT_CONFIG || {}, people = cfg.people || {};
    document.getElementById("occasion").textContent = cfg.occasion || "";
    var list = document.getElementById("people");
    Object.keys(people).forEach(function (k) {
      var p = people[k], li = document.createElement("li"), a = document.createElement("a");
      a.className = "person"; a.href = k + "/";
      var name = document.createElement("span"); name.className = "person-name"; name.textContent = p.name || k;
      var sub = document.createElement("span"); sub.className = "person-sub"; sub.textContent = "Lista prezentów " + (p.nameGen || p.name || k);
      a.appendChild(name); a.appendChild(sub);
      a.insertAdjacentHTML("beforeend", '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>');
      li.appendChild(a); list.appendChild(li);
    });
  })();
</script>
</body>
</html>
